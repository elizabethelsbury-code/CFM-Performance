<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#38352F">
<title>CFM Performance</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
:root{
  --bg:#38352F; --surface:#413E37; --surface-2:#4A473F;
  --text:#F5F1E8; --text-dim:#B3AFA4; --text-faint:#847E70;
  --brass:#4CA893; --brass-dim:#1F3A34;
  --rust:#C15C33; --rust-dim:#4A2A1C;
  --sage:#8A9A79; --sage-dim:#33392C;
  --border:#59554A;
  --font-display:'Oswald',sans-serif; --font-body:'Inter',-apple-system,sans-serif; --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;overscroll-behavior-y:none;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:var(--font-display);text-transform:uppercase;letter-spacing:0.02em;margin:0;}
.eyebrow{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-faint);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px;font-family:var(--font-mono);}
.field input{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:11px;font-size:15px;}
.field input:focus{outline:none;border-color:var(--brass);}
.btn{width:100%;background:var(--brass);color:#0A1F1A;border:none;border-radius:9px;padding:13px;font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:0.04em;text-transform:uppercase;}
.btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
.btn.danger{background:var(--rust);color:#fff;}
.err{color:var(--rust);font-size:13px;margin-bottom:10px;}
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.authbox{width:100%;max-width:380px;}
.brand{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:0.05em;text-align:center;margin-bottom:22px;}
.brand span{color:var(--brass);}
.toggle-link{text-align:center;margin-top:14px;font-size:13px;color:var(--text-dim);}
.toggle-link a{color:var(--brass);cursor:pointer;text-decoration:underline;}
header{padding:18px 18px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
main{padding:16px 18px 90px;max-width:560px;margin:0 auto;}
.navbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);border-top:1px solid var(--border);z-index:30;overflow-x:auto;}
.navbtn{flex:0 0 auto;min-width:70px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 8px;background:none;border:none;color:var(--text-faint);font-family:var(--font-mono);font-size:9px;letter-spacing:0.04em;text-transform:uppercase;}
.navbtn.active{color:var(--brass);}
.navbtn .ic{font-size:16px;line-height:1;}
.section-label{font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;color:var(--text-faint);text-transform:uppercase;margin-bottom:8px;}
.setrow{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.setrow .idx{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);width:14px;}
.setrow input{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:7px 8px;font-size:13px;font-family:var(--font-mono);}
.setrow .w{width:56px;} .setrow .r{width:48px;}
.setrow select{background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);border-radius:6px;padding:7px 4px;font-size:11px;font-family:var(--font-mono);}
.setrow .n{flex:1;min-width:0;font-family:var(--font-body);font-size:12px;}
.setrow button{background:none;border:none;color:var(--text-faint);font-size:13px;}
.addset{font-family:var(--font-mono);font-size:11px;color:#6E93AC;background:none;border:none;padding:2px 0;}
.histdate{font-family:var(--font-mono);font-size:11px;color:var(--brass);}
.histlabel{font-family:var(--font-display);font-weight:600;font-size:15px;}
.histhead{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:none;padding:0;color:inherit;text-align:left;}
.histbody{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.chip{background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:4px 8px;font-family:var(--font-mono);font-size:11px;color:var(--text);display:inline-block;margin:0 4px 4px 0;}
.videoLink{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#6E93AC;text-decoration:none;margin-top:4px;}
.emptystate{text-align:center;padding:40px 0;color:var(--text-faint);font-size:13px;}
.loading2{text-align:center;padding:30px 0;color:var(--text-faint);font-size:13px;}
.clientrow{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;}
.clientrow .name{font-family:var(--font-display);font-weight:500;font-size:15px;}
.loading{text-align:center;padding:60px 0;color:var(--text-faint);font-size:13px;}
.calweekrow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
.calweekday{text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--text-faint);text-transform:uppercase;}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.calcell{position:relative;aspect-ratio:1;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text);font-family:var(--font-mono);font-size:11px;cursor:pointer;padding:0;}
.calcell.calblank{background:none;border:none;cursor:default;}
.calcell.caltoday{border-color:var(--brass);}
.caldot{width:6px;height:6px;border-radius:50%;}
.caldot.calmissed{background:none;border:1px solid var(--rust);}
.legdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle;background:var(--surface-2);}
.legdot.calmissed{background:none;border:1px solid var(--rust);}
</style>
</head>
<body>
<header style="border-bottom:1px solid var(--border);padding:14px 18px;text-align:center;">
  <div class="brand" style="margin-bottom:0;">CFM <span>Performance</span></div>
</header>
<div id="app"><div class="loading">Loading…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="app.js?v=22"></script>
</body>
</html>
